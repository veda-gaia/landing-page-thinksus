<div class="brand-white-bg py-5">
    <div class="container py-5">
        <div class="col">
            <div class="row">
                <div class="d-flex flex-column flex-md-row align-items-start gap-5">
                    <div class="w-100">
                        <h3 class="brand-text pb-2">Fale com a ThinkSus!</h3>
                        <h5 class="brand-text fw-400">
                            simply dummy text of the printing and typesetting
                        </h5>
                    </div>
    
                    <form [formGroup]="form" class="w-100 d-block" (submit)="onSubmit()">
                        <div class="input-container mb-3">
                            <input type="text" class="w-100" formControlName="name" placeholder="Nome completo" autocomplete="off" id="name" name="name">
                            <img src="/assets/icon/name.svg" alt="Nome" class="input-icon">
                        </div>
                        
                        <div class="input-container mb-3">
                            <input type="email" class="w-100" formControlName="email" placeholder="E-mail" autocomplete="off" id="email" name="email">
                            <img src="/assets/icon/email.svg" alt="email" class="input-icon">
                        </div>
                        
                        <div class="input-container mb-3">
                            <input type="text" class="w-100" formControlName="subject" placeholder="Assunto da mensagem" autocomplete="off" id="subject" name="subject">
                            <img src="/assets/icon/subject.svg" alt="Assunto" class="input-icon">
                        </div>
                        
                        <textarea class="w-100" formControlName="message" placeholder="Deixe aqui sua mensagem se tiver dúvidas sobre nossos produtos e planos, sugestões de melhorias, ou reclamações sobre nossos serviços que logo retornaremos seu contato." autocomplete="off" id="message" name="message"></textarea>

                        <div class="w-100 d-flex justify-content-end pt-4">
                            <button class="brand-btn px-5" type="submit" [disabled]="form.invalid">Enviar mensagem</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="container pt-5">
    <div class="row pt-5">
        <div class="col pb-3">
            <img src="/assets/logo/footer-logo.svg" alt="ThinkSus" class="mb-2 d-block mx-auto mx-md-0" width="316px">
        </div>
    </div>

    <div class="row">
        <div class="col d-flex flex-column flex-md-row align-items-center justify-content-between pb-3">
            <div>
                <p class="f-size-1-3125rem fw-400 brand-text l-spacing-0-75 l-height-2-0625 pb-3 text-center text-md-start">
                    A sua parceira e-ESG
                </p>
                <a class="f-size-1-rem fw-500 secondary-text l-spacing-1-68 l-height-1-5 text-decoration-underline cursor-pointer d-block text-center text-md-start w-100">Termos de privacidade</a>
            </div>

            <div class="d-flex align-items-center justify-content-end gap-4 pt-5">
                <a href="">
                    <img src="/assets/icon/linkedin.svg" alt="Linkedin">
                </a>
                <a href="">
                    <img src="/assets/icon/instagram.svg" alt="Instagram">
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col pb-5 pt-4">
            <p class="f-size-1rem fw-300 gray-4-text l-spacing-1-68 text-center l-height-1-5">Copyright ©2024 Todos os direitos reservados</p>
        </div>
    </div>
</footer>
