<header class="position-fixed" [class.navbarScrolled]="navbarScrolled">
    <div class="fade-in container">
        <div class="row">
            <div class="col d-flex align-items-center justify-content-between gap-2">
                <a href="" class="flex-grow-0 pe-5" routerLink="/home" (click)="scrollToTop()">
                    <img src="/assets/logo/logo.svg" alt="" class="header-logo" width="130px">
                </a>

                <nav class="fade-in d-none d-lg-block">
                    <ul class="d-flex align-items-center justify-content-center gap-3">
                        <li>
                            <a routerLink="/home" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Home</a>
                        </li>
                        <li>
                            <a routerLink="/esg" (click)="scrollToTop()" routerLinkActive="active" class="px-4">ESG</a>
                        </li>
                        <li>
                            <a routerLink="/plans" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Planos</a>
                        </li>
                        <li>
                            <a routerLink="/about-us" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Sobre nós</a>
                        </li>
                    </ul>
                </nav>

                <nav class="fade-in d-none d-lg-block">
                    <ul class="d-flex align-items-center justify-content-center gap-3">
                        <li>
                            <button class="white-outline-btn">
                                Criar conta
                            </button>
                        </li>
                        <li>
                            <button class="white-btn">
                                Entrar
                            </button>
                        </li>
                    </ul>
                </nav>

                <!-- Mobile btn -->
                <button class="d-block d-lg-none bg-transparent mobile-btn" (click)="toggleMenuMobile()">
                    <img src="/assets/icon/menu-toggler.svg" alt="" width="30px" height="30px">
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Menu Mobile -->
<div class="menu-mobile-backdrop" (click)="toggleMenuMobile()" [class.active]="menuMobileOpen"></div>

<aside class="menu-mobile d-block d-lg-none position-fixed m-0 px-5 pt-3" [class.active]="menuMobileOpen">
    <div class="py-3 d-flex align-items-center justify-content-between cursor-pointer" (click)="toggleMenuMobile()">
        <h4 class="white-text f-size-1-5rem fw-500">Menu</h4>
        <button class="border-0 bg-transparent">
            <img src="/assets/icon/close-menu.svg" alt="Fechar menu" width="20px" height="20px">
        </button>
    </div>

    <nav class="py-5" (click)="toggleMenuMobile()">
        <ul class="d-flex flex-column align-items-center justify-content-center gap-4">
            <li>
                <a routerLink="/home" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Home</a>
            </li>
            <li>
                <a routerLink="/esg" (click)="scrollToTop()" routerLinkActive="active" class="px-4">ESG</a>
            </li>
            <li>
                <a routerLink="/plans" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Planos</a>
            </li>
            <li>
                <a routerLink="/about-us" (click)="scrollToTop()" routerLinkActive="active" class="px-4">Sobre nós</a>
            </li>
        </ul>
    </nav>
    
    <nav class="pt-5" (click)="toggleMenuMobile()">
        <ul class="d-flex flex-column align-items-center justify-content-end gap-3">
            <li>
                <button class="white-outline-btn w-100 text-center">
                    Criar conta
                </button>
            </li>
            <li>
                <button class="white-btn w-100 text-center" style="min-width: 146px;">
                    Entrar
                </button>
            </li>
            <div class="d-flex align-items-center justify-content-start pt-2">
                <li>
                    <a href="https://www.linkedin.com/company/thinksus" target="_blank" class="d-flex align-items-center justify-content-center">
                        <img src="/assets/icon/linkedin.svg" alt="Linkedin">
                    </a>
                </li>
                <li>
                    <a href="https://www.instagram.com/thinksus?igsh=MWtjMGF5NHlxeHg2bA== " class="d-flex align-items-center justify-content-center">
                        <img src="/assets/icon/instagram.svg" alt="instagram">
                    </a>
                </li>
            </div>
        </ul>
    </nav>
</aside>
