<section class="w-100 pt-3">
    <div class="row pb-4">
        <div class="col">
            <h3 class="alpha-800-text f-size-1-5rem l-height-1-5rem pb-1 fw-800">
                Melhorias
            </h3>
            <p class="f-size-0-85rem alpha-700-text fw-500 l-height-1-25">
                Nossas sugestões
            </p>
        </div>
    </div>

    <div class="fade-in row pb-5">
        <div class="col">
            <div class="card-logged p-4 d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-4 w-100">
                <div class="flex-grow-1">
                    <p class="secondary-text f-size-1rem fw-500 pb-3">
                        Empresa: <span class="fw-700 gray-text">Superemp</span>
                    </p>
                    
                    <p class="secondary-text f-size-1rem fw-500">
                        Setor: <span class="fw-700 gray-text">Indústria</span>
                    </p>
                </div>

                <div class="flex-grow-1">
                    <p class="secondary-text f-size-1rem fw-500 pb-3">
                        CNPJ: <span class="fw-700 gray-text">00.000.000/0000-00</span>
                    </p>
                    
                    <p class="secondary-text f-size-1rem fw-500">
                        Setor: <span class="fw-700 gray-text">Têxtil ou peles</span>
                    </p>
                </div>

                <div class="flex-grow-1">
                    <p class="secondary-text text-end f-size-0-85rem l-height-1-25 fw-500">
                        Pontuação ThinkSus
                    </p>
                    
                    <p class="system-success-text text-end f-size-3rem l-height-3 fw-700">
                        97
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="fade-in row">
        <div class="col-12 col-lg-8">
            <img src="/assets/img/city-bg.webp" alt="Cidade" width="100%" class="d-block w-100" style="border-radius: 1rem;">
        </div>

        <div class="col-12 col-lg-4">
            <div *ngFor="let item of infoArray" class="card-logged custom-accordion p-4 mb-2" [class.active]="openAccordions.includes(item.number)">
                <div class="cursor-pointer d-flex align-items-center justify-content-between" (click)="toggleAccordion(item.number)">
                    <p class="d-flex align-items-end justify-content-start gap-2 fw-700 f-size-1-5rem l-height-1-5 green-600-text">
                        {{ item.number }} <span class="fw-700 f-size-1-25rem l-height-1-25 green-600-text">{{ item.title }}</span>
                    </p>

                    <img src="/assets/icon/open-close.svg" alt="Icon" class="open-close-icon">
                </div>

                <div class="content-custom-accordion">
                    <p class="f-size-0-85rem fw-500 alpha-800-text l-height-1-25 w-100">
                        {{ item.description }}
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="fade-in row py-4">
        <div class="col">
            <div class="pb-3">
                <h4 class="primary-text f-size-1-5rem fw-700 pb-1">
                    Aderência aos ODS  voltados para área Ambiental
                </h4>

                <p class="alpha-700-text f-size-0-85rem fw-500">
                    Foque nas ODS abaixo
                </p>
            </div>
    
            <div class="card-logged rounded d-flex align-items-end justify-content-between gap-3 w-100 p-2 mb-2">
                <div class="flex-grow-1 flex-wrap d-flex align-item-center justify-content-start gap-2">
                    <img src="/assets/icon/selos-ods/1.svg" alt="1" title="1">
                    <img src="/assets/icon/selos-ods/2.svg" alt="2" title="2">
                    <img src="/assets/icon/selos-ods/3.svg" alt="3" title="3">
                    <img src="/assets/icon/selos-ods/4.svg" alt="4" title="4">
                    <img src="/assets/icon/selos-ods/5.svg" alt="5" title="5">
                    <img src="/assets/icon/selos-ods/6.svg" alt="6" title="6">
                </div>
            </div>
        </div>
    </div>
</section>
