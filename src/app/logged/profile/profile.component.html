<section class="w-100 pt-3 pb-5">
    <div class="row pb-5">
        <div class="col">
            <div class="card-logged p-4 d-flex flex-column flex-lg-row align-items-start align-items-lg-center justify-content-between gap-4 w-100">
                <div class="flex-grow-1">
                    <p class="brand-text f-size-1-25rem fw-800 pb-2">
                        Mateus Borges
                    </p>
                    
                    <p class="secondary-text f-size-0-85rem fw-500 pt-1">
                        ColabX
                    </p>
                </div>

                <div class="flex-grow-0">
                    <button class="brand-btn">
                        {{ "PROFILE.EDIT" | translate }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="fade-in row">
        <div class="col">
            <p class="brand-text f-size-1rem fw-800 pb-4">
                Meus Certificados
            </p>

            <div class="w-100 pb-2">
                <div class="table-container-real">
                    <table class="white-bg border-radius-10 pt-2">
                        <tr class="header-row-tr">
                            <th>{{ "PROFILE.TITLE" | translate }}</th>
                            <th>{{ "PROFILE.COMPANY" | translate }}</th>
                            <th>{{ "PROFILE.EMISSION_DATE" | translate }}</th>
                            <th>{{ "PROFILE.ACTIONS" | translate }}</th>
                        </tr>
                        <tr *ngFor="let item of myContractsList" class="body-row-tr">
                            <td class="">
                                {{ item.name }}
                            </td>
                            <td class="">
                                {{ item.company }}
                            </td>
                            <td class="">
                                {{ item.emissionDate }}
                            </td>
                            <td class="">
                                <button class="bg-transparent fw-600 brand-text text-decoration-underline border-0 shadow-none d-flex align-items-center justify-content-end gap-2" title="Baixar">
                                    Baixar
                                    <img src="/assets/icon/download-no-bg-23.svg" width="16px" alt="Baixar">
                                </button>
                            </td>
                        </tr>
                    </table>
                </div>

                <p *ngIf="!myContractsList.length" class="w-100 text-center py-4 py-xl-5 color-app-300 font-s-09rem d-flex align-items-center justify-content-center gap-2">
                    {{ "SCORE.NO_RESULTS" | translate }}
                </p>
            </div>
        </div>
    </div>
</section>
