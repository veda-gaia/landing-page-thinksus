<button class="open-btn" [class.active]="sidebarOpen" (click)="toggleSidebar()">
    <img src="/assets/icon/sidebar-btn.svg" alt="Abrir navegação">
</button>

<aside class="sidebar-logged h-100" [class.active]="sidebarOpen">
    <div>
        <button class="bg-transparent p-3 pt-0 ps-0 border-0 shadow-none" [class.active]="sidebarOpen" (click)="toggleSidebar()">
            <img src="/assets/icon/sidebar-btn.svg" alt="Abrir navegação">
        </button>
    
        <a class="d-flex align-items-center justify-content-between gap-3 py-3 cursor-pointer">
            <p class="f-size-12px white-text fw-500 l-height-1rem">
                Realize uma Avaliação para saber o seu Status ESG:
            </p>
            <img src="/assets/icon/plus.svg" alt="Fazer Avaliação">
        </a>
    
        <nav class="pt-3 w-100">
            <ul class="m-0 p-0 d-flex align-items-start justify-content-start flex-column gap-2 w-100">
                <li class="w-100">
                    <a class="nav-link-btn" routerLink="/logged/dashboard" routerLinkActive="active">
                        <img src="/assets/icon/home.svg" alt="Home">
                        Home
                    </a>
                </li>
                <li class="w-100">
                    <a class="nav-link-btn" routerLink="/logged/assesment" routerLinkActive="active">
                        <img src="/assets/icon/assesment.svg" alt="Avaliação">
                        Avaliação
                    </a>
                </li>
                <li class="w-100">
                    <a class="nav-link-btn" routerLink="/logged/results" routerLinkActive="active">
                        <img src="/assets/icon/results.svg" alt="Home">
                        Resultados
                    </a>
                </li>
                <li class="w-100">
                    <a class="nav-link-btn" routerLink="/logged/ods" routerLinkActive="active">
                        <img src="/assets/icon/ods.svg" alt="ODS">
                        ODS
                    </a>
                </li>
                <li class="w-100">
                    <a class="nav-link-btn" routerLink="/logged/use-instructions" routerLinkActive="active">
                        <img src="/assets/icon/use-instructions.svg" alt="use-instructions">
                        Instruções de uso
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div>
        <p class="brand-50-text f-size-0-8rem l-height-1-25 fw-700">Quer mais?</p>
        <p class="brand-50-text f-size-0-8rem l-height-1-25 fw-400">Tenha acesso a mais dados em nossa plataforma.</p>

        <button class="white-outline-btn d-flex align-items-center justify-content-between mt-3 w-100">
            Ver Planos
            <img src="/assets/icon/tag.svg" alt="Planos">
        </button>
    </div>
</aside>
